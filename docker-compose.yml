services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "4000:4000"
    environment:
      APP_DATA_DIR: /app/data
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      PIPELINE_SCHEDULER_ENABLED: ${PIPELINE_SCHEDULER_ENABLED:-true}
      SENS_INTERVAL_SECONDS: ${SENS_INTERVAL_SECONDS:-3600}
      FULL_INTERVAL_SECONDS: ${FULL_INTERVAL_SECONDS:-86400}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000/api}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
