services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "4000:4000"
    environment:
      APP_DATA_DIR: /app/data
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      PIPELINE_SCHEDULER_ENABLED: ${PIPELINE_SCHEDULER_ENABLED:-true}
      SENS_INTERVAL_SECONDS: ${SENS_INTERVAL_SECONDS:-3600}
      FULL_INTERVAL_SECONDS: ${FULL_INTERVAL_SECONDS:-86400}
      TIMING_TIMEZONE: ${TIMING_TIMEZONE:-Africa/Johannesburg}
      TIMING_GEMINI_RETRY_SECONDS: ${TIMING_GEMINI_RETRY_SECONDS:-300}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
